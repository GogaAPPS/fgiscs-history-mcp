name: CI

on:
  push:

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT || '.' }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run project checks
        run: inv check

      - name: Validate Docker Compose config
        run: |
          cp .env.fgis_config.example .env.fgis_config
          docker compose --env-file .env.fgis_config config --quiet

      - name: Validate deployment YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in [Path("Deployfile.yml"), *sorted(Path("k8s").glob("*.yaml"))]:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"{path}: ok")
          PY

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          tags: fgiscs-history-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
