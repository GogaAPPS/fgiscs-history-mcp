services:
  fgiscs-history-mcp:
    build: .
    image: fgiscs-history-mcp:local
    env_file:
      - .env.fgis_config
      - path: .env.fgis_secrets
        required: false
    ports:
      - "127.0.0.1:${FGISCS_MCP_PUBLISHED_PORT:-8002}:8000"
    volumes:
      - fgiscs-data:/app/data/cache
    restart: unless-stopped
    networks:
      - fgis-integration

volumes:
  fgiscs-data:

networks:
  fgis-integration:
    name: aide-fgis-integration
