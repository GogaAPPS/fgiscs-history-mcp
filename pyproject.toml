[project]
name = "fgiscs-history-mcp"
version = "0.1.0"
description = "MCP server over the version history of Russian construction-pricing open data (ФГИС ЦС)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "open-data", "russia", "construction", "pricing", "fgiscs", "minstroy"]
dependencies = ["mcp>=2.0,<3.0", "truststore>=0.9", "invoke>=2.2.1,<3.0.0", "ruff>=0.16.3,<1.0.0"]

[project.urls]
Homepage = "https://github.com/elysosss/fgiscs-history-mcp"

[project.scripts]
fgiscs-history-mcp = "server:main"
fgiscs-history-mcp-sync = "sync_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "portal", "local_index", "sync_data"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["data/*.json", "data/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E741"]
