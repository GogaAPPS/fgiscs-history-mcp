[project]
name = "fgiscs-history-mcp"
version = "0.1.0"
description = "MCP server over the version history of Russian construction-pricing open data (ФГИС ЦС)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "open-data", "russia", "construction", "pricing", "fgiscs", "minstroy"]
dependencies = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/elysosss/fgiscs-history-mcp"

[project.scripts]
fgiscs-history-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["data/*.json", "data/*.jsonl"]
